services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shopee_db
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${SA_PASSWORD}"
    ports:
      - "${MSSQL_PORT:-1433}:1433"
    volumes:
      - mssql_data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -Q \"SELECT 1\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s

  db-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: shopee_db_init
    user: root
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      SA_PASSWORD: "${SA_PASSWORD}"
    volumes:
      - ./DATABASE/QLSANPHAM.sql:/init/QLSANPHAM.sql:ro
      - ./DATABASE/seed_data.sql:/init/seed_data.sql:ro
      - ./DATABASE/init-db.sh:/init/init-db.sh:ro
    entrypoint: ["/bin/bash", "/init/init-db.sh"]

  web:
    build:
      context: ./ShopeeClone
      dockerfile: Dockerfile
    container_name: shopee_web
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    ports:
      - "${APP_PORT:-5017}:5017"
    environment:
      - ASPNETCORE_ENVIRONMENT=${ASPNETCORE_ENVIRONMENT:-Development}
      - ASPNETCORE_URLS=http://+:5017
      - ConnectionStrings__DefaultConnection=Server=db;Database=QLSANPHAM;User Id=sa;Password=${SA_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;

volumes:
  mssql_data:

